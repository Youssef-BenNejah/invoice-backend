services:
  app:
    build: .
    env_file: .env
    environment:
      - DB_HOST=mongo
      - DB_PORT=27017
    ports:
      - "8090:${APP_PORT}"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
